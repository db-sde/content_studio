# Render Blueprint for the image_pipeline/ Python service ONLY - the existing Node app
# (content_studio itself) was set up manually in the Render dashboard and is untouched by this
# file. Deploying this blueprint creates 3 new resources: the FastAPI web service, the Celery
# worker, and a managed Redis instance for them to share as the task broker.
#
# IMPORTANT: storage_backend must be "r2", not "local", on Render. The web service and worker
# below are separate instances that do NOT share a filesystem - a locally-stored image written
# by the worker would be invisible to the web service serving /media. Local disk storage only
# works for single-machine local dev (worker + web on the same box, as tested), never here.
#
# Env vars marked `sync: false` are secrets Render will prompt for once, during blueprint
# creation - they are never written into this file or committed to the repo.

services:
  - type: web
    name: content-studio-image-pipeline
    runtime: python
    rootDir: image_pipeline
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # same Neon connection string the Node app already uses
      - key: REDIS_URL
        fromService:
          name: content-studio-image-pipeline-redis
          type: redis
          property: connectionString
      - key: IMAGE_PIPELINE_API_KEY
        sync: false # self-generated shared secret - must match this same key on the Node service
      - key: PROVIDER_MODE
        value: live
      - key: IMAGE_PROVIDER
        value: flux
      - key: FAL_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false # same key the Node app already uses
      - key: IMAGE_PIPELINE_ANTHROPIC_MODEL
        value: claude-opus-5
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

  - type: worker
    name: content-studio-image-pipeline-worker
    runtime: python
    rootDir: image_pipeline
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks.celery_app worker --loglevel=info -c 2
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: content-studio-image-pipeline-redis
          type: redis
          property: connectionString
      - key: IMAGE_PIPELINE_API_KEY
        sync: false
      - key: PROVIDER_MODE
        value: live
      - key: IMAGE_PROVIDER
        value: flux
      - key: FAL_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: IMAGE_PIPELINE_ANTHROPIC_MODEL
        value: claude-opus-5
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

  - type: redis
    name: content-studio-image-pipeline-redis
    plan: starter
    ipAllowList: [] # internal-only: reachable from the two services above via REDIS_URL, not from the public internet
