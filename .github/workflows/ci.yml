# Runs on every push to main and every pull request. A red check here means a change broke app
# logic, removed a cost/usage limit, or made a polled endpoint heavier - see tests/README.md.
# None of these jobs has (or needs) any real API key or database: the Node tests use an in-memory
# Postgres and block all outside network calls; the Python tests use the free mock provider.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Content Studio (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image-pipeline:
    name: Image pipeline (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: image_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: image_pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
